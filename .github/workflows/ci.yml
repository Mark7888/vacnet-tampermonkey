name: CI

# `pull_request` (never `pull_request_target`) is what makes fork PRs safe: the
# job runs the contributor's code with a read-only GITHUB_TOKEN and no access to
# repository secrets. Nothing in this workflow needs write access, so a malicious
# PR has nothing to steal. Everything that does need write access lives in
# publish-edge.yml and release.yml, which fork PRs cannot trigger.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Deny by default; each job opts into the one scope it needs.
permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Type-check, build and verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          # Keeps the job's token out of .git/config, so a compromised
          # dependency lifecycle script cannot pick it up and push with it.
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npm run typecheck

      - run: npm run build

      # Fails the build if the shipped metadata block, and in particular the
      # @downloadURL/@updateURL Tampermonkey re-fetches on every update check,
      # is not exactly what this channel is supposed to publish.
      - run: npm run verify

      # actions/dependency-review-action would add licence and advisory
      # gating on the PR diff, but it needs Advanced Security, which this
      # private repository does not have. `npm audit` plus Dependabot cover
      # the same advisories for the three dev-dependencies here.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      - uses: actions/upload-artifact@v5
        with:
          name: vacnet-enhancer-userscript
          path: |
            dist/vacnet-enhancer.user.js
            dist/vacnet-enhancer.meta.js
          if-no-files-found: error
          retention-days: 30

  test:
    name: Browser tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npx playwright install --with-deps chromium

      - run: npm run build

      - run: npm test
